name: gravital_talk_app
description: "Gravital Talk — app multiplataforma (P2P + servidor)"
publish_to: 'none'
version: 0.3.0-alpha.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado y ciclo de vida de la app.
  provider: ^6.1.5
  # Persistencia de perfiles y ajustes.
  shared_preferences: ^2.5.3
  # Llamadas FFI a `libgravital_talk_ffi` (C ABI v1).
  ffi: ^2.1.4
  # API HTTP del relay (rooms, healthz) y diagnóstico.
  http: ^1.5.0
  # Plan de control gRPC (cliente generado desde proto/gravital/v1).
  grpc: ^5.1.0
  protobuf: ^6.1.0
  fixnum: ^1.1.0
  # QR del room code / pairing.
  qr_flutter: ^4.1.0
  # Captura de micrófono PCM16 y reproducción PCM (audio real).
  record: ^6.1.2
  flutter_sound: ^9.28.0
  # Componentes UI modernos (shortlist de FlutterGems/FlutterLibrary).
  flutter_animate: ^4.5.2
  animate_do: ^5.1.0
  toastification: ^3.2.0
  settings_ui: ^4.0.1
  percent_indicator: ^4.2.5
  mobile_scanner: ^7.4.2
  introduction_screen: ^5.0.1
  # Lanzar enlaces (repositorio/docs en "Acerca de").
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
