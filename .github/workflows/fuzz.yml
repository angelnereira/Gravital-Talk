name: Fuzz

# Smoke de fuzzing por target (cargo-fuzz en contenedor).
# - Manual: Actions → Fuzz → Run workflow (segundos configurables).
# - Programado: lunes 03:00 UTC.

on:
  # Gate de PR: smoke corto contra el mismo conjunto de targets.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: "Segundos de fuzzing por target"
        required: false
        default: "60"
        type: string
  schedule:
    - cron: "0 3 * * 1"

# El preset de PR es corto para no frenar las revisiones; el semanal/manual
# mantiene 60 s o el valor elegido en el dispatch.
env:
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '15' || inputs.seconds || '60' }}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: fuzz (${{ github.event_name == 'pull_request' && '15' || inputs.seconds || '60' }}s/target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build fuzz image (nightly + cargo-fuzz)
        run: docker compose --profile security build fuzz

      - name: Run fuzz smoke
        run: |
          docker compose --profile security run --rm \
            -e FUZZ_SECONDS="${{ env.FUZZ_SECONDS }}" fuzz

      - name: Upload crash artifacts (si hubo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14