name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "verify/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native audio deps
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            audio_deps: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
          - os: macos-latest
            audio_deps: brew install opus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native audio deps
        run: ${{ matrix.audio_deps }}
      - run: cargo test --workspace --all-targets

  test-no-default:
    name: test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test
          -p gravital-talk-core
          -p gravital-talk-metrics
          -p gravital-talk-transport
          --no-default-features

  ffi-header:
    name: cbindgen header + gcc smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native audio deps
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - run: cargo build -p gravital-talk-ffi --release
      - run: cc -I crates/gravital-talk-ffi/include -c crates/gravital-talk-ffi/tests/c_smoke.c -o /tmp/c_smoke.o

  cross-wasm:
    name: check wasm32 core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p gravital-talk-core

  cross-aarch64:
    name: check aarch64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: >
          cargo check
          --target aarch64-unknown-linux-gnu
          --no-default-features
          -p gravital-talk-core
          -p gravital-talk-transport

  # Auditoría del audio real sobre UDP loopback. No necesita libopus ni ALSA
  # (el códec por defecto es PCM y la fuente de audio es interna), así que
  # corre en cualquier runner sin dependencias del sistema.
  #
  # Es el test que distingue "llegaron datagramas" de "el audio cruzó el
  # protocolo": mide la frecuencia y el RMS de lo recibido.
  audit:
    name: audit (audio bidireccional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audit P2P (turnos partidos, ambas direcciones)
        run: |
          cargo run --release -p gravital-talk-audit --bin gs-audit -- \
            --mode p2p --port 34100 --duration-ms 4000 --split-turns \
            --frame-ms 10 --verify-audio --expect-rx-frames 5 \
            --expect-peer-ptt 1 --json audit-p2p.json
      - name: Audit N sesiones paralelas (sin cross-talk)
        run: |
          cargo run --release -p gravital-talk-audit --bin gs-audit -- \
            --mode p2p --port 34100 --duration-ms 4000 --sessions 3 \
            --frame-ms 10 --verify-audio --expect-rx-frames 5 \
            --json audit-parallel.json
      - name: Subir informes PCM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-pcm-reports
          path: audit-*.json
          if-no-files-found: ignore

  # Opus necesita libopus, asi que va en un job aparte. Cubre el tamaño de
  # frame de 20 ms que el README documenta (PCM no cabe en el tope del core).
  audit-opus:
    name: audit (opus, 20 ms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - name: Test de integración Opus
        run: cargo test -p gravital-talk-audit --features opus
      - name: Auditoría Opus
        run: |
          cargo run --release -p gravital-talk-audit --features opus --bin gs-audit -- \
            --mode p2p --port 34200 --duration-ms 4000 --split-turns \
            --codec opus --frame-ms 20 --verify-audio --expect-rx-frames 5 \
            --expect-peer-ptt 1 --json audit-opus.json

  # Cada job sube sus propios informes: un runner nuevo no ve los ficheros
      # que produjo otro job.
      - name: Subir informe Opus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-opus-report
          path: audit-opus.json
          if-no-files-found: ignore

  python-sdk:
    name: python sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin pytest
      - working-directory: sdks/python
        run: |
          maturin build --release --strip --out dist
          pip install --force-reinstall dist/*.whl
          pytest tests/
