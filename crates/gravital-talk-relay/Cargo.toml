[package]
name         = "gravital-talk-relay"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Gravital Talk — relay server productivo (UDP + WebSocket, métricas Prometheus)."
readme       = "../../README.md"

[lib]
name = "gravital_talk_relay"
path = "src/lib.rs"

[[bin]]
name = "gs-relay"
path = "src/main.rs"

[dependencies]
gravital-talk-core      = { workspace = true }
gravital-talk-transport = { workspace = true }
tokio             = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { workspace = true }
futures-util      = "0.3"
bytes             = { workspace = true }
clap              = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow            = { workspace = true }
serde             = { workspace = true }
serde_json         = "1"
toml              = "0.8"
hyper             = { version = "1.5", features = ["server", "http1"] }
hyper-util        = { version = "0.1", features = ["tokio"] }
http-body-util    = "0.1"
prometheus        = { version = "0.13", default-features = false }
dashmap           = "6.1"
sha2              = { workspace = true }
# TLS: WSS (WebSocket seguro) y gRPC TLS (feature `tls`).
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }
# gRPC-Web (navegador) sobre el mismo puerto gRPC (feature `web`).
tonic-web      = { version = "0.12", optional = true }
# Plano de control gRPC (opcional; ver docs/grpc-evaluation.md)
tonic            = { version = "0.12", optional = true }
prost            = { version = "0.13", optional = true }
tokio-stream     = { version = "0.1", features = ["net"], optional = true }
async-stream     = { version = "0.3", optional = true }

[dev-dependencies]
tonic = { version = "0.12" }

[build-dependencies]
tonic-build      = { version = "0.12", features = ["prost"], optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
grpc    = [
    "dep:tonic",
    "dep:prost",
    "dep:tokio-stream",
    "dep:async-stream",
    "dep:tonic-build",
    "dep:protoc-bin-vendored",
]
tls     = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "tonic/tls",
]
web     = [
    "grpc",
    "dep:tonic-web",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
