[package]
name         = "gravital-talk-transport"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Gravital Talk — UDP transport, jitter buffer, session manager."
readme       = "../../README.md"

[lib]
name = "gravital_talk_transport"
path = "src/lib.rs"

[features]
default = ["noise"]
noise   = ["dep:snow"]

[dependencies]
snow = { version = "0.9", optional = true }

gravital-talk-core    = { workspace = true, default-features = false, features = ["alloc", "std"] }
gravital-talk-metrics = { workspace = true }
tokio             = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
socket2           = { workspace = true }
bytes             = { workspace = true }
crossbeam-queue   = { workspace = true }
smallvec          = { workspace = true }
tracing           = { workspace = true }
thiserror         = { workspace = true }
async-trait       = { workspace = true }
x25519-dalek      = { workspace = true }
hkdf              = { workspace = true }
sha2              = { workspace = true }
hmac              = { workspace = true }
rand_core         = { workspace = true }

[dev-dependencies]
# Sólo para el test de conformidad: los vectores canónicos del RFC 6238 usan
# HMAC-SHA1. La producción usa SHA-256 (ver `pairing.rs`).
sha1 = "0.10"
tokio              = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "test-util"] }
tracing-subscriber = { workspace = true }
proptest           = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
