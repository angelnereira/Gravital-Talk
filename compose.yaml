# Gravital Talk — stack completo de contenedores.
#
# Perfiles:
#   (default)     relay  — daemon en primer plano
#   e2e           relay + host + join  — prueba multi-contenedor headless
#   test          tester               — cargo test --workspace
#   bench         bench                — criterion en contenedor
#   perf          relay + netem-join   — rendimiento bajo red simulada (tc)
#   security      fuzz                 — cargo-fuzz (nightly), targets acotados
#   audit         audit                — auditoría de audio real (gs-audit)
#   observability prometheus + grafana — métricas del relay
#
# Uso (ver Makefile): `make docker-e2e`, `make docker-test`, `make docker-perf`, …

name: gravital-talk

services:
  # ── Relay (terminal central) ────────────────────────────────────────────
  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: relay
      args:
        # p. ej.: CARGO_FEATURES="--features grpc" docker compose build relay
        CARGO_FEATURES: ${CARGO_FEATURES:-}
    image: gravital-talk/relay:local
    ports:
      - "9000:9000/udp"
      - "9090:9090/tcp"
      - "9100:9100/tcp"
      # Plano de control gRPC (solo si se compila con CARGO_FEATURES=--features grpc)
      - "50051:50051"
    environment:
      GS_LOG: ${GS_LOG:-info}
      # Paquetes/segundo por IP (0 = ilimitado). Protección DoS.
      GS_RATE_LIMIT: ${GS_RATE_LIMIT:-0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ── E2E multi-contenedor: host + join headless ─────────────────────────
  room-host:
    profiles: ["e2e", "perf"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - room-code:/shared
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/room-host.sh"]
    environment:
      RELAY_HOST: relay
      UDP_PORT: "9000"
      OBS_PORT: "9100"
      SESSION_ID: "305419896"
      DURATION: "25"

  room-join:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    depends_on:
      relay:
        condition: service_healthy
      room-host:
        condition: service_started
    volumes:
      - room-code:/shared
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/room-join.sh"]
    environment:
      RELAY_HOST: relay
      UDP_PORT: "9000"
      OBS_PORT: "9100"
      DURATION: "10"

  # ── Auditoría end-to-end del audio real (gs-audit) ─────────────────────
  # A diferencia del perfil `e2e`, este verifica el CONTENIDO del audio
  # recibido (frecuencia, RMS, saturación) y no sólo que llegan frames.

  # P2P y paralelo: no necesitan relay, así que van solos.
  audit:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    volumes:
      - audit-out:/shared/audit
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/audit.sh"]
    environment:
      SCENARIOS: "${SCENARIOS:-p2p parallel}"
      SESSIONS: "${SESSIONS:-3}"
      DURATION_MS: "${DURATION_MS:-4000}"
      FRAME_MS: "${FRAME_MS:-10}"
      CODEC: "${CODEC:-pcm}"
      BASE_PORT: "${BASE_PORT:-34100}"

  # Ancla de sala para el escenario `room`: crea el código y se queda
  # escuchando mientras `audit-room` verifica el audio en AMBAS direcciones a
  # través del relay. Es la bidireccionalidad que el perfil `e2e` no comprueba,
  # porque allí el host nunca asserta su propia recepción.
  audit-room-host:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - room-code:/shared
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/room-host.sh"]
    environment:
      RELAY_HOST: relay
      UDP_PORT: "9000"
      OBS_PORT: "9100"
      SESSION_ID: "305419896"
      DURATION: "40"

  audit-room:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    depends_on:
      relay:
        condition: service_healthy
      audit-room-host:
        condition: service_started
    volumes:
      - room-code:/shared
      - audit-out:/shared/audit
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/audit.sh"]
    environment:
      SCENARIOS: "${ROOM_SCENARIOS:-room}"
      SESSIONS: "${SESSIONS:-3}"
      DURATION_MS: "${ROOM_DURATION_MS:-5000}"
      FRAME_MS: "${ROOM_FRAME_MS:-20}"
      # El códec lo negocia el primer cliente de la sala, que es el ancla
      # (`gs ptt`, Opus por defecto). Debe coincidir con el suyo.
      CODEC: "${ROOM_CODEC:-opus}"
      BASE_PORT: "${ROOM_BASE_PORT:-34120}"
      RELAY_HOST: relay
      RELAY_UDP_PORT: "9000"
      RELAY_OBS_PORT: "9100"

  # ── Suite de tests en contenedor ───────────────────────────────────────
  tester:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/src:cached
      - cargo-cache:/usr/local/cargo/registry
      - cargotarget:/src/target
    working_dir: /src
    command: ["cargo", "test", "--workspace", "--all-targets"]

  # ── Benchmarks criterion ───────────────────────────────────────────────
  bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/src:cached
      - cargo-cache:/usr/local/cargo/registry
      - cargotarget:/src/target
      - bench-output:/src/target/criterion
    working_dir: /src
    command: ["cargo", "bench", "--workspace"]

  # ── Rendimiento bajo red simulada (tc netem) ───────────────────────────
  netem-join:
    profiles: ["perf"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cli
    image: gravital-talk/cli:local
    cap_add:
      - NET_ADMIN
    depends_on:
      relay:
        condition: service_healthy
      room-host:
        condition: service_started
    volumes:
      - room-code:/shared
      - ./docker/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/netem-join.sh"]
    environment:
      RELAY_HOST: relay
      UDP_PORT: "9000"
      OBS_PORT: "9100"
      DURATION: "10"
      DELAY_MS: "30"
      JITTER_MS: "5"
      LOSS_PERCENT: "1"

  # ── Fuzzing (seguridad) ────────────────────────────────────────────────
  fuzz:
    profiles: ["security"]
    build:
      context: .
      dockerfile: docker/Dockerfile.fuzz
    volumes:
      - cargo-cache:/usr/local/cargo/registry
      - cargotarget:/src/target
    environment:
      FUZZ_SECONDS: ${FUZZ_SECONDS:-60}

  # ── Observabilidad ─────────────────────────────────────────────────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - relay

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: gravital
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  room-code:
  cargo-cache:
  cargotarget:
  bench-output:
  audit-out: